<rect id="n1f1" x="100" y="2702" width="440" height="26" data-content="Dispara a rotina todo dia às 8h." fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n1f2" x="100" y="3012" width="440" height="26" data-content="Campos" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n2f1" x="1440" y="2702" width="440" height="26" data-content="Busca quem faz aniversário hoje." fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n2f2" x="1440" y="3012" width="440" height="26" data-content="Campos" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n3f1" x="2780" y="2762" width="440" height="26" data-content="Decide se tem alguém pra notificar hoje." fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n3f2" x="2780" y="3072" width="440" height="26" data-content="Campos" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n4f1" x="4280" y="1772" width="440" height="26" data-content="Manda a mensagem de parabéns pelo WhatsApp." fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n4f2" x="4280" y="1462" width="440" height="26" data-content="Campos" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n5f1" x="4280" y="3172" width="440" height="26" data-content="Registra que rodou e não tinha ninguém." fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n5f2" x="4280" y="2862" width="440" height="26" data-content="Campos" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="t12ft" x="770" y="2519" width="440" height="26" data-content="sai do 1 · entra no 2" fill="#d0d0d0" data-text-color="#333333" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="t12fo" x="770" y="2620" width="440" height="26" data-content="Observações" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="t23ft" x="2110" y="2519" width="440" height="26" data-content="sai do 2 · entra no 3" fill="#d0d0d0" data-text-color="#333333" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="t23fo" x="2110" y="2620" width="440" height="26" data-content="Observações" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="lg0" x="100" y="60" width="400" height="26" data-content="Como ler este quadro" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="lg1" x="560" y="60" width="800" height="26" data-content="Legenda de cores · a cor diz de que categoria o nó é" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="lg2" x="560" y="320" width="800" height="26" data-content="A forma diz o que o nó faz com o dado" fill="#ededed" data-text-color="#6e6e6e" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="n1p0" data-type="sticky" x="140" y="2738" width="359" height="234" data-color="yellow" data-content="Gatilho fixo, sem entrada. Existe só pra dar a largada do dia." />
<rect id="n2p0" data-type="sticky" x="1480" y="2738" width="359" height="234" data-color="yellow" data-content="Consulta direta na base de clientes, filtrando pela data de hoje." />
<rect id="n3p0" data-type="sticky" x="2820" y="2798" width="359" height="234" data-color="yellow" data-content="Se a lista veio vazia, não faz sentido seguir seguir — vira &quot;não&quot;." />
<rect id="n4p0" data-type="sticky" x="4320" y="1528" width="359" height="234" data-color="yellow" data-content="Chamada a um subfluxo à parte — é ele quem fala com a API do WhatsApp." />
<rect id="n5p0" data-type="sticky" x="4320" y="2928" width="359" height="234" data-color="yellow" data-content="Sem isso, uma falha silenciosa da consulta pareceria igual a &quot;não tinha ninguém&quot;." />
<rect id="lgp0" data-type="sticky" x="140" y="96" width="319" height="208" data-color="yellow" data-content="Amarelo é sempre &quot;o que faz&quot;. Observação (se houver) vai em card cinza." />
<rect id="lgp1" data-type="sticky" x="140" y="334" width="319" height="208" data-color="yellow" data-content="Forma diz o verbo do nó: pílula dispara, retângulo processa, losango decide." />
<rect id="t12o0" x="810" y="2661" width="360" height="180" rx="16" data-content="Sem payload: é só o disparo do relógio." fill="#f5f5f5" data-text-color="#1a1a1a" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<rect id="t23o0" x="2150" y="2661" width="360" height="180" rx="16" data-content="Uma lista, não um item — pode ter zero, um ou vários aniversariantes." fill="#f5f5f5" data-text-color="#1a1a1a" data-font-size="13" data-font-family="roboto_mono" stroke="#1a1a1a" />
<textArea id="n1l" x="100" y="3053" width="440" font-size="20" font-family="Plex Mono" fill="#333333" text-align="left">hora = 08:00</textArea>
<textArea id="n2l" x="1440" y="3053" width="440" font-size="20" font-family="Plex Mono" fill="#333333" text-align="left">1. data = hoje<br />2. campo = data_nascimento</textArea>
<textArea id="n3l" x="2780" y="3113" width="440" font-size="20" font-family="Plex Mono" fill="#333333" text-align="left">lista.length &gt; 0</textArea>
<textArea id="n4l" x="4280" y="1391" width="440" font-size="20" font-family="Plex Mono" fill="#333333" text-align="left">telefone<br />nome</textArea>
<textArea id="n5l" x="4280" y="2819" width="440" font-size="20" font-family="Plex Mono" fill="#333333" text-align="left">motivo = sem_aniversariante</textArea>
<textArea id="t12lt" x="770" y="2560" width="440" font-size="14" font-family="Roboto Mono" fill="#333333" text-align="left">{ }</textArea>
<textArea id="t23lt" x="2110" y="2560" width="440" font-size="14" font-family="Roboto Mono" fill="#333333" text-align="left">[{ nome, telefone, data_nascimento }, ...]</textArea>
<textArea id="lgf" x="570" y="404" width="780" font-size="14" font-family="Roboto Mono" fill="#333333" text-align="left">pílula = dispara o fluxo<br />retângulo = processa, transforma ou consulta<br />losango = decide um caminho<br />círculo = repete<br />elipse = espera<br />hexágono = sai do fluxo e volta<br />canto forte = grava o resultado</textArea>
</g>
</svg>